<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1976D2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PCHelper — мобильная витрина</title>
    <style>
      /* Мобильный экран ЛР7. Отдельная страница, а не адаптив React:
         методичка просит первый экран мобильного приложения, а не
         уменьшенную копию веба. Данные те же — API /api/v1. */
      :root {
        --primary: #1976d2;
        --primary-soft: #e3f2fd;
        --accent: #fbc02d;
        --bg: #f5f5f5;
        --surface: #ffffff;
        --border: #e8e8e8;
        --text: #111111;
        --muted: #555555;
        --faint: #8a8a8a;
        --radius: 12px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 15px;
        padding-bottom: 76px;
      }
      .screen { display: none; }
      .screen.is-on { display: block; }
      header {
        position: sticky; top: 0; z-index: 5; background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex; align-items: center; gap: 10px; padding: 12px 16px;
      }
      .brand-mark {
        width: 32px; height: 32px; border-radius: 9px; background: var(--primary);
        color: #fff; font-size: 12px; font-weight: 700;
        display: flex; align-items: center; justify-content: center;
      }
      .brand { font-weight: 700; color: var(--primary); font-size: 17px; }
      .back {
        width: 34px; height: 34px; border: 0; background: none; font-size: 20px;
        color: var(--text); cursor: pointer;
      }
      .hero { padding: 18px 16px 8px; }
      .hero h1 { font-size: 22px; margin-bottom: 6px; }
      .hero p { color: var(--muted); font-size: 13px; }
      .chips {
        display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px;
        scrollbar-width: none;
      }
      .chips::-webkit-scrollbar { display: none; }
      .chip {
        flex: 0 0 auto; padding: 8px 14px; border-radius: 999px;
        border: 1px solid var(--border); background: var(--surface);
        color: var(--muted); font-size: 13px; cursor: pointer;
      }
      .chip.is-on { background: var(--primary); color: #fff; border-color: var(--primary); }
      .list { padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 10px; }
      .card {
        display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 10px; cursor: pointer;
      }
      .card img { width: 84px; height: 84px; object-fit: contain; border-radius: 8px;
                  background: #fafafa; flex: 0 0 auto; }
      .card .photo-empty { width: 84px; height: 84px; border-radius: 8px; background: #fafafa;
                           color: var(--faint); font-size: 11px; display: flex;
                           align-items: center; justify-content: center; flex: 0 0 auto; }
      .card .name { font-size: 14px; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
      .card .cat { font-size: 11px; color: var(--faint); margin-bottom: 6px; }
      .card .price { font-size: 16px; font-weight: 700; color: var(--primary); }
      .detail { padding: 16px; }
      .detail .photo { background: var(--surface); border: 1px solid var(--border);
                       border-radius: var(--radius); height: 230px; display: flex;
                       align-items: center; justify-content: center; margin-bottom: 14px; }
      .detail .photo img { max-width: 90%; max-height: 210px; object-fit: contain; }
      .detail h2 { font-size: 19px; margin-bottom: 6px; }
      .detail .price { font-size: 24px; font-weight: 700; color: var(--primary); margin: 10px 0; }
      .detail dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px;
                   font-size: 13px; margin-top: 14px; }
      .detail dt { color: var(--faint); }
      .detail dd { text-align: right; }
      .buy {
        position: fixed; left: 0; right: 0; bottom: 60px; background: var(--surface);
        border-top: 1px solid var(--border); padding: 8px 16px; display: none;
      }
      .buy.is-on { display: block; }
      .btn {
        width: 100%; border: 0; border-radius: 10px; padding: 13px;
        background: var(--primary); color: #fff; font-size: 15px; font-weight: 600;
        cursor: pointer;
      }
      nav.tabs {
        position: fixed; left: 0; right: 0; bottom: 0; height: 60px;
        background: var(--surface); border-top: 1px solid var(--border);
        display: grid; grid-template-columns: repeat(4, 1fr);
      }
      .tab {
        border: 0; background: none; color: var(--faint); font-size: 11px;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 2px; cursor: pointer; position: relative;
      }
      .tab .ico { font-size: 18px; }
      .tab.is-active { color: var(--primary); font-weight: 600; }
      .tab .badge {
        position: absolute; top: 6px; right: 28%; min-width: 16px; height: 16px;
        border-radius: 9px; background: var(--accent); color: #111;
        font-size: 10px; font-weight: 700; display: none;
        align-items: center; justify-content: center; padding: 0 4px;
      }
      .tab .badge.is-on { display: inline-flex; }
      .empty { color: var(--muted); text-align: center; padding: 40px 20px; }
      .toast {
        position: fixed; left: 50%; transform: translateX(-50%); bottom: 130px;
        background: rgba(17, 17, 17, 0.9); color: #fff; padding: 10px 16px;
        border-radius: 999px; font-size: 13px; opacity: 0; transition: 0.2s;
        pointer-events: none; z-index: 10;
      }
      .toast.is-on { opacity: 1; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand-mark">PC</div>
      <div class="brand">PCHelper</div>
    </header>

    <main>
      <section class="screen is-on" id="screen-list">
        <div class="hero">
          <h1>Комплектующие</h1>
          <p>Цены в белорусских рублях. Выберите категорию.</p>
        </div>
        <div class="chips" id="chips"></div>
        <div class="list" id="list">
          <div class="empty">Загрузка…</div>
        </div>
      </section>

      <section class="screen" id="screen-detail">
        <div class="detail" id="detail"></div>
      </section>
    </main>

    <div class="buy" id="buy">
      <button class="btn" id="buy-btn">Добавить в корзину</button>
    </div>

    <div class="toast" id="toast"></div>

    <nav class="tabs">
      <button class="tab is-active"><span class="ico">⌂</span>Главная</button>
      <button class="tab"><span class="ico">▤</span>Каталог</button>
      <button class="tab"><span class="ico">🛒</span>Корзина<span class="badge" id="badge">0</span></button>
      <button class="tab"><span class="ico">◉</span>Профиль</button>
    </nav>

    <script>
      const API = '/api/v1';
      const state = { categories: [], category: 'cpu', product: null };
      const el = (id) => document.getElementById(id);
      const money = (value) =>
        new Intl.NumberFormat('ru-RU').format(Number(value || 0)) + ' BYN';

      function cart() {
        try {
          return JSON.parse(localStorage.getItem('pchelper-cart') || '[]');
        } catch {
          return [];
        }
      }

      function refreshBadge() {
        const count = cart().reduce((sum, item) => sum + item.qty, 0);
        const badge = el('badge');
        badge.textContent = count;
        badge.classList.toggle('is-on', count > 0);
      }

      function addToCart(product) {
        const items = cart();
        const found = items.find((item) => item.id === product.id);
        if (found) found.qty += 1;
        else items.push({ id: product.id, name: product.name, price: product.price, qty: 1 });
        localStorage.setItem('pchelper-cart', JSON.stringify(items));
        refreshBadge();
        const toast = el('toast');
        toast.textContent = 'Добавлено в корзину';
        toast.classList.add('is-on');
        setTimeout(() => toast.classList.remove('is-on'), 1600);
      }

      function show(screen) {
        document.querySelectorAll('.screen').forEach((node) => node.classList.remove('is-on'));
        el(screen).classList.add('is-on');
        el('buy').classList.toggle('is-on', screen === 'screen-detail');
      }

      async function loadCategories() {
        const res = await fetch(API + '/categories');
        const data = await res.json();
        state.categories = data.items;
        el('chips').innerHTML = data.items
          .map(
            (item) =>
              `<span class="chip${item.id === state.category ? ' is-on' : ''}" data-cat="${item.id}">${item.name}</span>`
          )
          .join('');
      }

      async function loadProducts() {
        el('list').innerHTML = '<div class="empty">Загрузка…</div>';
        const res = await fetch(`${API}/products?category=${state.category}&limit=20`);
        const data = await res.json();
        if (!data.items.length) {
          el('list').innerHTML = '<div class="empty">В этой категории пока пусто</div>';
          return;
        }
        el('list').innerHTML = data.items
          .map(
            (item) => `
            <article class="card" data-id="${item.id}">
              ${item.imageUrl ? `<img src="${item.imageUrl}" alt="${item.name}" loading="lazy">` : '<div class="photo-empty">фото</div>'}
              <div>
                <div class="name">${item.name}</div>
                <div class="cat">${item.categoryName}</div>
                <div class="price">${money(item.price)}</div>
              </div>
            </article>`
          )
          .join('');
      }

      async function openProduct(id) {
        const res = await fetch(`${API}/products/${encodeURIComponent(id)}`);
        if (!res.ok) return;
        state.product = await res.json();
        const p = state.product;
        el('detail').innerHTML = `
          <button class="back" id="back">←</button>
          <div class="photo">${p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}">` : 'фото'}</div>
          <h2>${p.name}</h2>
          <div class="cat" style="color:var(--faint);font-size:12px">${p.categoryName}</div>
          <div class="price">${money(p.price)}</div>
          <p style="color:var(--muted);font-size:13px">${p.description}</p>
          <dl>${p.specs.map((s) => `<dt>${s.label}</dt><dd>${s.value}</dd>`).join('')}</dl>`;
        el('back').onclick = () => show('screen-list');
        show('screen-detail');
      }

      el('chips').addEventListener('click', (event) => {
        const chip = event.target.closest('[data-cat]');
        if (!chip) return;
        state.category = chip.dataset.cat;
        document.querySelectorAll('.chip').forEach((node) =>
          node.classList.toggle('is-on', node.dataset.cat === state.category)
        );
        loadProducts();
      });

      el('list').addEventListener('click', (event) => {
        const card = event.target.closest('[data-id]');
        if (card) openProduct(card.dataset.id);
      });

      el('buy-btn').onclick = () => state.product && addToCart(state.product);

      (async function start() {
        refreshBadge();
        await loadCategories();
        await loadProducts();
      })();
    </script>
  </body>
</html>
