# =====================================================================
#  PCHelper — конфигурация nginx для контейнера веб-приложения
#  Отвечает за: раздачу SPA, fallback на index.html и проксирование /api
#  на контейнер backend (точка 9 задания 6 — «Hello World» проверяется
#  именно через этот маршрут).
# =====================================================================

upstream pchelper_api {
    server api:3001;
    keepalive 16;
}

server {
    listen       80;
    server_name  localhost;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 5m;

    # --- сжатие ---
    gzip             on;
    gzip_types       text/plain text/css application/json application/javascript
                     application/xml+rss image/svg+xml;
    gzip_min_length  1024;

    # --- безопасность ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN  always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # --- проксирование API ---
    location /api/ {
        proxy_pass         http://pchelper_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Swagger UI / OpenAPI ---
    location /docs {
        proxy_pass http://pchelper_api;
    }

    # --- статика с длительным кешированием ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA fallback: любой неизвестный путь отдаёт index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # точка 9 задания 6: приложение типа «Hello World»,
    # подтверждающее работоспособность окружения
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'PCHelper frontend is up and running';
    }
}