# =====================================================================
#  PCHelper — параметры анализа SonarQube
#  Лабораторная работа № 4, задание 6, пункт 12.
#
#  Этот файл лежит в репозитории
#      https://github.com/AlekseiNarkevich/pchelper-infra
#  и соответствует конвейеру .github/workflows/ci.yml (job sonar-scan).
#
#  ЗАПУСК СОНАРА ЛОКАЛЬНО (SonarQube Community в Docker):
#      docker run --rm -it -p 9000:9000 \
#          -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
#          sonarqube:community
#
#      docker run --rm --network host \
#          -e SONAR_HOST_URL=http://localhost:9000 \
#          -e SONAR_TOKEN=<ваш_токен> \
#          -v "${PWD}/backend:/usr/src" \
#          sonarsource/sonar-scanner-cli \
#          -Dsonar.projectKey=pchelper-infra \
#          -Dsonar.qualitygate.wait=true
#
#  ИМЯ ПРОЕКТА в интерфейсе SonarQube должно совпадать с projectKey:
#  при создании проекта в веб-интерфейсе указать «pchelper-infra».
#
#  ВАЖНО: строка sonar.organization нужна ТОЛЬКО для SonarCloud.
#  Локальный SonarQube Community её не использует, поэтому здесь её нет —
#  иначе сканер завершается ошибкой.
# =====================================================================

sonar.projectKey=pchelper-infra
sonar.projectName=PCHelper Infrastructure
sonar.projectVersion=1.0.0

# --- Исходники ---
# В репозитории инфраструктуры код лежит в каталоге backend/src.
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.sourceEncoding=UTF-8

# --- Исключения: зависимости и артефакты сборки не анализируем ---
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.min.js
sonar.coverage.exclusions=**/*.config.js,**/node_modules/**

# --- Покрытие кода ---
# Отчёт генерируется этапом «Unit и integration-тесты» и передаётся
# в Sonar отдельным артефактом; путь указывается относительно /usr/src.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- Анализ спецификации OpenAPI (задание 3) ---
# Файл лежит в каталоге api/ на верхнем уровне репозитория.
sonar.openapi.path=../api/openapi.yaml
sonar.openapi.rules=rule:S1481,rule:S2077

# --- Проверка качества (Quality Gate) ---
# Конвейер не идёт дальше, пока Quality Gate не станет GREEN.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# --- Без обёртки компилятора: код чистый JavaScript ---
sonar.cfamily.build-wrapper-output.bypass=true