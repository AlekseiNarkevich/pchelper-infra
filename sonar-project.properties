# =====================================================================
#  PCHelper — параметры анализа SonarQube / SonarQubeCloud
#  Лабораторная работа № 4, задание 6, пункт 12.
#
#  Этот файл лежит в корне репозитория
#      https://github.com/AlekseiNarkevich/pchelper-infra
#  и читается сканером автоматически: отдельные аргументы в конвейере
#  .github/workflows/ci.yml передавать не нужно.
#
#  ВАЖНО ПРО ПУТИ. Этот файл рассчитан на запуск сканера ИЗ КОРНЯ
#  репозитория — именно так он запускается в GitHub Actions:
#
#      - uses: SonarSource/sonarqube-scan-action@v5
#        with:
#          args: -Dsonar.qualitygate.wait=true
#
#  Локальный запуск делается так же, из корня репозитория:
#
#      docker run --rm --network host \
#          -e SONAR_HOST_URL=https://sonarcloud.io \
#          -e SONAR_TOKEN=<ваш_токен> \
#          -v "${PWD}:/usr/src" \
#          sonarsource/sonar-scanner-cli \
#          -Dsonar.projectKey=pchelper-infra
#
#  Пути ниже указаны ОТ КОРНЯ, поэтому начинаются с backend/.
#  Если указать просто src, сканер не найдёт ничего и выдаст
#  «0 файлов проанализировано».
# =====================================================================

sonar.projectKey=pchelper-infra
sonar.projectName=PCHelper Infrastructure
sonar.projectVersion=1.0.0

# --- Организация в SonarQubeCloud ---
# ОБЯЗАТЕЛЬНАЯ строка. Без неё сканер не знает, в какой организации
# искать проект, и завершается ошибкой:
#     You must define the following mandatory properties:
#     sonar.organization
# Ключ организации виден на странице проекта в SonarCloud:
#     URL вида https://sonarcloud.io/organizations/<ключ>/projects
#     или в настройках организации: Administration → General.
#
# Для самостоятельно развёрнутого SonarQube (Docker, порт 9000)
# эта строка не нужна и просто игнорируется — там проекты живут
# без организаций.
sonar.organization=alekseinarkevich

# --- Исходники и тесты (пути от корня репозитория) ---
sonar.sources=backend/src,mcp
sonar.tests=backend/tests,mcp/tests
sonar.test.inclusions=backend/tests/**
sonar.sourceEncoding=UTF-8

# --- Исключения: зависимости и артефакты сборки не анализируем ---
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.min.js,db/**,docs/**,wiki/**,diagrams/**
sonar.coverage.exclusions=**/*.config.js,**/node_modules/**

# --- Покрытие кода ---
# Отчёт генерирует c8 на этапе «Unit и integration-тесты»
# (npm run test:coverage) и передаётся в Sonar артефактом coverage.
# Путь здесь указывается относительно корня репозитория.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# --- Анализ спецификации OpenAPI (задание 3) ---
sonar.openapi.path=api/openapi.yaml
sonar.openapi.rules=rule:S1481,rule:S2077

# --- Проверка качества (Quality Gate) ---
# Конвейер не идёт дальше, пока Quality Gate не станет зелёным.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# --- Без обёртки компилятора: код чистый JavaScript ---
sonar.cfamily.build-wrapper-output.bypass=true