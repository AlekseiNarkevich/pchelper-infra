# =====================================================================
#  PCHelper — CI/CD-конвейер (GitHub Actions)
#  Задание 6, пункты 6, 10, 11, 12, 13.
#
#  Логика конвейера:
#    PR в develop  → lint → unit-тесты → сборка образа (без публикации)
#    push в main   → lint → тесты → SonarQube Quality Gate →
#                    генерация Swagger → сборка и публикация образа →
#                    автоматический деплой на Render
#
#  Образ публикуется только при зелёном Quality Gate —
#  это гарантирует требование «сервер CI формирует сборку
#  только после прохождения тестов и проверки качества кода».
# =====================================================================

name: PCHelper CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  API_IMAGE: ${{ github.repository }}/api
  WEB_IMAGE: ${{ github.repository }}/web

jobs:

  # -------------------------------------------------------------------
  # Этап 0. Качество кода (ESLint + Prettier)
  # -------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Установить зависимости
        working-directory: backend
        run: npm ci

      - name: ESLint
        working-directory: backend
        run: npm run lint

      - name: Prettier — проверка форматирования
        working-directory: backend
        run: npm run format:check

  # -------------------------------------------------------------------
  # Этап 1. Автоматические тесты
  #   Сервер CI выполняет тесты ДО сборки образа (пункт 6 задания 6).
  # -------------------------------------------------------------------
  test:
    name: Unit и integration-тесты
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: pchelper_test
          POSTGRES_USER: pchelper
          POSTGRES_PASSWORD: pchelper_test_password
        ports: [ 5432:5432 ]
        options: >-
          --health-cmd "pg_isready -U pchelper"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [ 6379:6379 ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Применить схему БД
        working-directory: backend
        env:
          PGPASSWORD: pchelper_test_password
        run: |
          psql "postgresql://pchelper@localhost:5432/pchelper_test" \
               -v ON_ERROR_STOP=1 \
               -f ../db/01_schema.sql \
               -f ../db/02_marketplace.sql \
               -f ../db/03_indexes_constraints.sql \
               -f ../db/04_views.sql \
               -f ../db/05_seed.sql

      - name: Установить зависимости
        working-directory: backend
        run: npm ci

      - name: Юнит-тесты с покрытием
        working-directory: backend
        env:
          DATABASE_URL: postgresql://pchelper:pchelper_test_password@localhost:5432/pchelper_test
          REDIS_URL: redis://localhost:6379
          CI: "true"
        run: npm run test:ci

      - name: Отчёт о покрытии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage/
          retention-days: 7

  # -------------------------------------------------------------------
  # Этап 2. Генерация спецификации Swagger (пункт 11 задания 6)
  #   Swagger-файлы генерируются на этапе сборки и публикуются
  #   как артефакт, а затем попадают в GitHub Pages и wiki.
  # -------------------------------------------------------------------
  openapi:
    name: Генерация Swagger
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установить Redocly CLI
        run: npm install --global @redocly/cli

      - name: Проверить спецификацию OpenAPI
        run: redocly lint api/openapi.yaml

      - name: Собрать единый файл спецификации
        run: redocly bundle api/openapi.yaml --output api/dist/openapi.bundled.yaml

      - name: Сгенерировать статическую документацию
        run: |
          npx @redocly/cli build-docs api/dist/openapi.bundled.yaml \
            --output api/dist/index.html
          npx @redocly/cli build-docs api/dist/openapi.bundled.yaml \
            --output api/dist/swagger.json

      - uses: actions/upload-artifact@v4
        with:
          name: swagger-docs
          path: api/dist/
          retention-days: 30

  # -------------------------------------------------------------------
  # Этап 3. Проверка качества кода SonarQube (пункт 12 задания 6)
  #   Образы собираются только после успешного Quality Gate.
  # -------------------------------------------------------------------
  sonar:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: [ test, lint ]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # полная история для blame

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Загрузить отчёт о покрытии
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: backend/coverage

      - name: SonarScanner — анализ
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=pchelper_students_trio
            -Dsonar.sources=backend/src,backend/server.js
            -Dsonar.tests=backend/tests
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # -------------------------------------------------------------------
  # Этап 4. Сборка и публикация Docker-образов (пункт 10 задания 6)
  # -------------------------------------------------------------------
  build-and-push:
    name: Сборка и публикация образов
    runs-on: ubuntu-latest
    needs: [ test, sonar ]

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Образ backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./infra/backend/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Образ frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./infra/frontend/Dockerfile
          target: prod
          push: true
          build-args: |
            VITE_API_URL=/api/v1
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------
  # Этап 5. Развёртывание backend на Render (пункт 13 задания 6)
  #   Срабатывает только после успеха всех предыдущих этапов.
  # -------------------------------------------------------------------
  deploy:
    name: Деплой на Render
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Сообщить Render о новом коммите
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK не задан — деплой пропущен"
            exit 0
          fi
          curl -sS -X POST "$RENDER_DEPLOY_HOOK" \
               -H 'Content-Type: application/json' \
               -d "{\"commitId\": \"$COMMIT_SHA\"}"
          echo "Деплой запущен для коммита $COMMIT_SHA"