# =====================================================================
#  PCHelper — CI/CD-конвейер (GitHub Actions)
#  Задание 6, пункты 6, 10, 11, 12, 13.
#
#  Логика конвейера:
#    PR в develop  → lint → тесты → Swagger
#    push в main   → lint → тесты → Swagger → SonarQube Quality Gate →
#                    сборка и публикация образов → деплой на Render
#
#  ПОЧЕМУ КАЧЕСТВО КОДА ЯВЛЯЕТСЯ БЛОКИРУЮЩИМ ЭТАПОМ
#  Задание требует, чтобы образ собирался только после прохождения
#  тестов И проверки качества кода. Поэтому этап build-and-push
#  объявлен через needs: [ test, sonar ], и публикация образа
#  произойдёт только при зелёном Quality Gate.
#
#  СЕКРЕТ, НЕОБХОДИМЫЙ ДЛЯ ЗАПУСКА
#    Settings → Secrets and variables → Actions → New repository secret
#      SONAR_TOKEN        токен SonarCloud или SonarQube
#
#  ОГРАНИЧЕНИЕ СИНТАКСИСА, О КОТОРОМ НУЖНО ЗНАТЬ
#    Контекст secrets НЕДОСТУПЕН в условии if на уровне задания (job).
#    GitHub покажет ошибку разбора всего файла: «Unrecognized named-value:
#    'secrets'». Разрешённые контексты здесь — только github, needs,
#    vars и inputs. Поэтому проверка наличия секрета выполняется
#    не в условии задания, а внутри шага (уровень step такой проверки
#    разрешён через env).
# =====================================================================

name: PCHelper CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# На уровне workflow остаются только права на чтение.
# Права на запуск выдаются конкретным job - иначе любой этап,
# включая форк, получает лишние возможности (SonarCloud S8233).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # ВАЖНО: имя образа должно начинаться с адреса реестра.
  # Без префикса ghcr.io/ buildx воспримет «AlekseiNarkevich»
  # как имя хоста и упадёт с ошибкой:
  #   dial tcp: lookup AlekseiNarkevich: no such host
  # Имя владельца пишется строчными буквами НАМЕРЕННО.
  # Docker требует, чтобы имя репозитория образа было в нижнем
  # регистре, а на GitHub у владельца есть заглавные буквы.
  # Подстановка ${{ github.repository_owner }} даст «AlekseiNarkevich»
  # и сборка упадёт с ошибкой:
  #   repository name must be lowercase
  IMAGE_OWNER: alekseinarkevich
  API_IMAGE: ghcr.io/alekseinarkevich/pchelper-infra/api
  WEB_IMAGE: ghcr.io/alekseinarkevich/pchelper-infra/web

jobs:
  # -------------------------------------------------------------------
  # Этап 0. Качество кода (ESLint + Prettier)
  #   Линтер ловит синтаксис, неиспользуемые переменные и недостижимый
  #   код; Prettier отвечает за единый стиль оформления.
  #   Проверки выполняются ДО тестов, чтобы экономить время раннера.
  # -------------------------------------------------------------------
  lint:
    name: Lint
    # Версия Ubuntu зафиксирована явно: метка ubuntu-latest
    # 19 октября 2026 года мигрирует на Ubuntu 26, и каждая
    # миграция ломает уже отлаженные сборки.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Установить зависимости
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: ESLint
        working-directory: backend
        run: npm run lint

      - name: Prettier — проверка форматирования
        working-directory: backend
        run: npm run format:check

  # -------------------------------------------------------------------
  # Этап 1. Автоматические тесты (пункт 6 задания 6)
  #
  #   Тесты лабораторного стенда не обращаются к базе данных: это
  #   юнит-тесты Express-приложения, поднятого прямо в процессе теста
  #   на случайном свободном порту. Поэтому внешние сервисы (PostgreSQL,
  #   Redis) здесь не нужны — конвейер не тратит минуты на их запуск.
  #   Покрытие считается инструментом c8 и передаётся в SonarQube
  #   следующим этапом отдельным артефактом.
  # -------------------------------------------------------------------
  test:
    name: Unit и integration-тесты
    # Версия Ubuntu зафиксирована явно: метка ubuntu-latest
    # 19 октября 2026 года мигрирует на Ubuntu 26, и каждая
    # миграция ломает уже отлаженные сборки.
    runs-on: ubuntu-24.04
    needs: lint

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Установить зависимости
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Юнит-тесты с покрытием
        working-directory: backend
        env:
          CI: 'true'
        run: npm run test:coverage

      - name: Отчёт о покрытии
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: coverage
          path: backend/coverage/
          retention-days: 7

  # -------------------------------------------------------------------
  # Этап 2. Генерация спецификации Swagger (пункт 11 задания 6)
  #   Спецификация проверяется линтером Redocly, собирается в один
  #   файл и превращается в статическую документацию — она потом
  #   попадёт в GitHub Pages и в вики репозитория.
  # -------------------------------------------------------------------
  openapi:
    name: Генерация Swagger
    # Версия Ubuntu зафиксирована явно: метка ubuntu-latest
    # 19 октября 2026 года мигрирует на Ubuntu 26, и каждая
    # миграция ломает уже отлаженные сборки.
    runs-on: ubuntu-24.04
    needs: lint

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 20

      - name: Установить Redocly CLI
        run: npm install --global @redocly/cli@2.63.0 --ignore-scripts

      - name: Проверить спецификацию OpenAPI
        run: redocly lint api/openapi.yaml

      - name: Собрать единый файл спецификации
        run: redocly bundle api/openapi.yaml --output api/dist/openapi.bundled.yaml

      - name: Сгенерировать статическую документацию
        run: |
          redocly build-docs api/dist/openapi.bundled.yaml \
            --output api/dist/index.html
          redocly build-docs api/dist/openapi.bundled.yaml \
            --output api/dist/swagger.json

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: swagger-docs
          path: api/dist/
          retention-days: 30

  # -------------------------------------------------------------------
  # Этап 3. Проверка качества кода SonarQube (пункт 12 задания 6)
  #
  #   Этап блокирующий: без зелёного Quality Gate образы не собираются.
  #   Выполняется при каждом пуше в main.
  #
  #   Если секрет SONAR_TOKEN ещё не создан, сканер завершится ошибкой —
  #   и это правильное поведение: задание требует настоящей проверки
  #   качества кода, а не «зелёной галочки». Настройка токена описана
  #   в README репозитория.
  # -------------------------------------------------------------------
  sonar:
    name: SonarQube Quality Gate
    # Версия Ubuntu зафиксирована явно: метка ubuntu-latest
    # 19 октября 2026 года мигрирует на Ubuntu 26, и каждая
    # миграция ломает уже отлаженные сборки.
    runs-on: ubuntu-24.04
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      checks: write          # отчёт SonarCloud публикуется как check

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0 # полная история коммитов для blame

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверить наличие токена SonarQube
        id: token
        env:
          TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Секрет SONAR_TOKEN не создан. Создайте его:"
            echo "::error::Settings → Secrets and variables → Actions"
            echo "::error::→ New repository secret → имя SONAR_TOKEN"
            echo "::error::Токен берётся в личном кабинете SonarCloud."
            exit 1
          fi
          echo "Токен SonarQube найден"

      - name: Загрузить отчёт о покрытии
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          name: coverage
          path: backend/coverage

      - name: SonarScanner — анализ и ожидание Quality Gate
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602  # v6
        env:
          # ОБЯЗАТЕЛЬНО для SonarCloud. Без этой переменной сканер
          # обращается к http://localhost:9000, где ничего не запущено,
          # и завершается ошибкой подключения. Для самостоятельно
          # развёрнутого SonarQube указывается адрес своего сервера.
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Область анализа задаётся здесь явно, а не только в
          # sonar-project.properties: параметры из args имеют
          # приоритет и не могут быть случайно переопределены.
          # Анализируется продукт - backend и MCP-сервер, оба
          # являются результатом лабораторной работы.
          # Каталоги db/ (SQL-скрипты проверки модели) и docs/
          # (статический сайт) не являются исходным кодом
          # приложения и исключены намеренно.
          args: >
            -Dsonar.sources=backend/src,mcp
            -Dsonar.tests=backend/tests,mcp/tests
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.min.js,db/**,docs/**,wiki/**,diagrams/**
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # -------------------------------------------------------------------
  # Этап 4. Сборка и публикация Docker-образов (пункт 10 задания 6)
  #
  #   Образы публикуются в GitHub Container Registry (ghcr.io) только
  #   после зелёных тестов И зелёного Quality Gate. Условие ниже
  #   явно допускает случай «Sonar пропущен», но не случай
  #   «Sonar провалился»: провал Quality Gate останавливает сборку.
  # -------------------------------------------------------------------
  build-and-push:
    name: Сборка и публикация образов
    # Версия Ubuntu зафиксирована явно: метка ubuntu-latest
    # 19 октября 2026 года мигрирует на Ubuntu 26, и каждая
    # миграция ломает уже отлаженные сборки.
    runs-on: ubuntu-24.04
    needs: [test, sonar]
    if: >-
      github.ref == 'refs/heads/main'
      && always()
      && needs.test.result == 'success'
      && (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')

    # Права на запись выдаются только этому этапу: на уровне workflow
    # осталось чтение. packages нужен для проталкивания образов в GHCR.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Образ backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Образ frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Сводка собранных образов
        run: |
          echo "### Собрано и опубликовано ###" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.API_IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.WEB_IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Реестр: ${{ env.REGISTRY }}" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------
  # Этап 5. Развёртывание backend на Render (пункт 13 задания 6)
  #   Срабатывает только после успеха сборки образа.
  #
  #   Проверка вебхука выполняется внутри шага, а не в условии задания:
  #   контекст secrets в условии job недоступен (см. шапку файла).
  #   Если вебхук ещё не создан, этап завершается предупреждением —
  #   это честнее, чем молчаливый пропуск.
  # -------------------------------------------------------------------
  deploy:
    name: Деплой на Render
    # Версия Ubuntu зафиксирована явно: метка ubuntu-latest
    # 19 октября 2026 года мигрирует на Ubuntu 26, и каждая
    # миграция ломает уже отлаженные сборки.
    runs-on: ubuntu-24.04
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Сообщить Render о новом коммите
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK не создан — деплой пропущен."
            echo "::warning::Создайте веб-сервис на render.com, затем:"
            echo "::warning::Settings → Secrets and variables → Actions"
            echo "::warning::→ New repository secret → имя RENDER_DEPLOY_HOOK"
            exit 0
          fi
          curl -sS -X POST "$RENDER_DEPLOY_HOOK" \
               -H 'Content-Type: application/json' \
               -d "{\"commitId\": \"$COMMIT_SHA\"}"
          echo "Деплой запущен для коммита $COMMIT_SHA"